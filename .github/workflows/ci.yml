---
# MCP Server CI — Python. Prepared locally; add via the GitHub web UI
# (the GitHub App cannot create .github/workflows/* files).
#
# The protocol test (test_client.py) is intentionally NOT run here:
# it calls live external APIs (HIBP, GitHub, exchange rates) whose
# rate limits would make CI flaky. It is run manually before releases.
# CI runs the offline unit tests and the linter, which are deterministic.
name: MCP Server CI
on:
  push:
    branches: [main, phase-1-security]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check server.py core tools tests test_client.py
      - run: python -m unittest discover -s tests -v
---
