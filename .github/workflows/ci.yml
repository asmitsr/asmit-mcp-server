---
name: MCP Server CI
on:
  push:
    branches: [main, phase-1-security]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . ruff
      - run: ruff check asmit_mcp tests test_client.py
      - run: python -m unittest discover -s tests -v
      - name: Import check (clean venv)
        run: |
          python -m venv /tmp/import-check-venv
          /tmp/import-check-venv/bin/pip install .
          cd /tmp
          /tmp/import-check-venv/bin/python -c "import asmit_mcp.server"
